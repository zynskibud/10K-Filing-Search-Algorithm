[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citation_rag"
version = "0.1.0"
description = "Citation RAG system"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "lxml",
    "psycopg[binary,pool]",
    "pgvector",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sentence-transformers",
    "torch",
    "transformers",
    "tqdm",
    "anthropic",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
managed = true

[dependency-groups]
langgraph = [
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-postgres>=0.0.18",
    "langgraph>=1.2.12",
    "rank-bm25>=0.2.2",
]
