[project]
name = "citation-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pgvector",
    "anthropic",
    "sentence-transformers",
    "beautifulsoup4",
    "lxml",
    "httpx",
    "pydantic-settings",
    "tiktoken",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest", "ruff"]
