version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: citation-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    mem_limit: 2g
    volumes:
      - citation_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  citation_rag_pgdata:
