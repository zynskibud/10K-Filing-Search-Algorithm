# One line per HEAVY wave: <wave>=<command>. scripts/run.sh <wave> reads it.
# Commands are filled in when each wave's code exists. A wave with no line
# here cannot start through run.sh, which is the point.
#
# Wave 4: the 7-index comparison build. The measured full-corpus ETAs (runs/wave-4/eta.txt)
# were 1.6 to 3.1 h per bge-small index and 25 to 61 h per bge-m3 index, so the
# comparison runs on a 150-filing subset that contains every filing the golden set
# points to (47) plus a seeded random fill; bge_m3__s2 is dropped (s2 vs s3 is
# tested on bge-small). Estimated GPU time about 16 h, resumable per 5,000-chunk shard.
4=uv run python -m citation_rag.index.build_all --full --subset 150 --include-golden --indexes bge_small__s1,bge_small__s2,bge_small__s3,bge_m3__s1,bge_m3__s3,bge_m3__s4 --chunks-dir data/chunks_subset --vectors-dir data/vectors_subset
#
# Wave 4w: the winning index over the full 1,194-filing corpus, after wave 5 picks it.
# 4w=uv run python -m citation_rag.index.build_all --full --indexes $WINNER_INDEX
#
# Wave 5: index x method comparison, then the exact-vs-HNSW recall check.
5=uv run python -m citation_rag.search.experiments --exp A && uv run python -m citation_rag.search.experiments --exp hnsw
#
# Wave 6: the six rerankers on the winning index/search, read from
# runs/wave-5/winners.json (written by the wave-5 report step). Judgment
# call: waves.conf holds one static command per wave, so this line is a
# small inline `bash -c` that reads the two winner fields with `python -c`
# (no `jq` dependency assumed) and passes them as --index/--search.
6=bash -c 'set -e; W=runs/wave-5/winners.json; IDX=$(uv run python -c "import json,sys; print(json.load(open(sys.argv[1]))[\"index\"])" "$W"); SRCH=$(uv run python -c "import json,sys; print(json.load(open(sys.argv[1]))[\"search\"])" "$W"); uv run python -m citation_rag.rerank.experiments --exp rerank --index "$IDX" --search "$SRCH"'
#
# Wave 7: the four Qwen3 8B answer runs over the dev golden set (winners from
# runs/wave-5/winners.json, reranker monot5), then the GPU reranker arms
# (listwise Qwen and MMR) on the same index and search. One line, joined by &&.
7=uv run python -m citation_rag.answer.run_all --split dev --runs A_think A_nothink B_think B_nothink && uv run python -m citation_rag.rerank.experiments --exp rerank --rerankers llm_listwise,mmr --out-dir runs/wave-7/rerank
#
# 8=uv run python -m citation_rag.evals.final --unseal
4s4=uv run python -m citation_rag.index.build_all --full --subset 150 --include-golden --indexes bge_m3__s4 --chunks-dir data/chunks_subset --vectors-dir data/vectors_subset
4w=uv run python -m citation_rag.index.build_all --full --indexes bge_small__s2
